    eg4_bms_id: pack2
    status:
      name: "pack 2 status"
    warnings:
      name: "pack 2 warnings"
    protection:
      name: "pack 2 protection"
  - platform: eg4_bms
    eg4_bms_id: pack3
    status:
      name: "pack 3 status"
    warnings:
