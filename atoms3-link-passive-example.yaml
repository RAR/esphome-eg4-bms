# Passive link-port monitor: M5Stack AtomS3 Lite + M5 RS485 unit (Grove).
#
# Listens to the EG4-LL paralleling (link) bus, an RS485 bus on which the
# master pack (DIP ID 1) polls the slave packs, and decodes every slave's
# answers. With eg4_modbus mode: passive the ESP never transmits, so it cannot
# disturb the master.
#
# Wiring - any free paralleling port of the chained packs (RJ45, T-568B):
#   RS485 A -> pin 1 (white/orange)
#   RS485 B -> pin 2 (orange)
#   GND     -> pin 8 (brown)
# The M5 RS485 unit switches direction automatically; no flow-control pin.
# See README "Passive Link Mode".

substitutions:
  name: eg4-link-monitor
  device_description: "Passively monitor EG4-LL slave packs on the link port"
  external_components_source: github://rar/esphome-eg4-bms@main
  # M5 RS485 unit on the AtomS3 Lite Grove port
  rx_pin: GPIO1
  # Only used by future active reads/writes; passive mode never writes.
  tx_pin: GPIO2

esphome:
  name: ${name}
  comment: ${device_description}
  min_version: 2024.6.0
  project:
    name: "rar.esphome-eg4-bms"
    version: 1.0.0

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

external_components:
  - source: ${external_components_source}
    refresh: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

ota:
  platform: esphome

logger:
  level: DEBUG

# Enable Home Assistant API
api:

uart:
  id: uart_link
  # The link bus runs Modbus RTU at 19200 8N1.
  baud_rate: 19200
  rx_pin: ${rx_pin}
  tx_pin: ${tx_pin}
  rx_buffer_size: 512

# Alternative: Atomic RS232 base as a single-ended tap. Its RX reads one leg
# of the RS485 pair against GND, which arrives inverted. Receive only - never
# connect the base's TX. Wire base GND -> pin 8 and base RX -> pin 1 or 2
# (swap if nothing decodes), and replace the uart block above with:
#
# uart:
#   id: uart_link
#   baud_rate: 19200
#   rx_pin:
#     number: GPIO5
#     inverted: true
#   rx_buffer_size: 512

eg4_modbus:
  id: link0
  uart_id: uart_link
  mode: passive

# One eg4_bms per slave pack DIP ID. The master (ID 1) is not polled on the
# link, so it is not visible here. Each pack is answered ~3x a second; sensors
# publish once per update_interval, and a pack is offline once nothing valid
# has been seen for max_no_response_count x update_interval (50 s here).
eg4_bms:
  - id: pack2
    address: 2
    eg4_modbus_id: link0
    update_interval: 10s
  - id: pack3
    address: 3
    eg4_modbus_id: link0
    update_interval: 10s
  - id: pack4
    address: 4
    eg4_modbus_id: link0
    update_interval: 10s

binary_sensor:
  - platform: eg4_bms
    eg4_bms_id: pack2
    online_status:
      name: "pack 2 online"
    heating:
      name: "pack 2 heating"
  - platform: eg4_bms
    eg4_bms_id: pack3
    online_status:
      name: "pack 3 online"
    heating:
      name: "pack 3 heating"
  - platform: eg4_bms
    eg4_bms_id: pack4
    online_status:
      name: "pack 4 online"
    heating:
      name: "pack 4 heating"

sensor:
  - platform: eg4_bms
    eg4_bms_id: pack2
    total_voltage:
      name: "pack 2 voltage"
    current:
      name: "pack 2 current"
    power:
      name: "pack 2 power"
    state_of_charge:
      name: "pack 2 state of charge"
    state_of_health:
      name: "pack 2 state of health"
    remaining_capacity:
      name: "pack 2 remaining capacity"
    full_capacity:
      name: "pack 2 full capacity"
    cycle_count:
      name: "pack 2 cycle count"
    min_cell_voltage:
      name: "pack 2 min cell voltage"
    max_cell_voltage:
      name: "pack 2 max cell voltage"
    delta_cell_voltage:
      name: "pack 2 delta cell voltage"
    max_temperature:
      name: "pack 2 max temperature"
    rejected_frame_count:
      name: "pack 2 rejected frames"

  - platform: eg4_bms
    eg4_bms_id: pack3
    total_voltage:
      name: "pack 3 voltage"
    current:
      name: "pack 3 current"
    power:
      name: "pack 3 power"
    state_of_charge:
      name: "pack 3 state of charge"
    state_of_health:
      name: "pack 3 state of health"
    remaining_capacity:
      name: "pack 3 remaining capacity"
    full_capacity:
      name: "pack 3 full capacity"
    cycle_count:
      name: "pack 3 cycle count"
    min_cell_voltage:
      name: "pack 3 min cell voltage"
    max_cell_voltage:
      name: "pack 3 max cell voltage"
    delta_cell_voltage:
      name: "pack 3 delta cell voltage"
    max_temperature:
      name: "pack 3 max temperature"
    rejected_frame_count:
      name: "pack 3 rejected frames"

  - platform: eg4_bms
    eg4_bms_id: pack4
    total_voltage:
      name: "pack 4 voltage"
    current:
      name: "pack 4 current"
    power:
      name: "pack 4 power"
    state_of_charge:
      name: "pack 4 state of charge"
    state_of_health:
      name: "pack 4 state of health"
    remaining_capacity:
      name: "pack 4 remaining capacity"
    full_capacity:
      name: "pack 4 full capacity"
    cycle_count:
      name: "pack 4 cycle count"
    min_cell_voltage:
      name: "pack 4 min cell voltage"
    max_cell_voltage:
      name: "pack 4 max cell voltage"
    delta_cell_voltage:
      name: "pack 4 delta cell voltage"
    max_temperature:
      name: "pack 4 max temperature"
    rejected_frame_count:
      name: "pack 4 rejected frames"

text_sensor:
