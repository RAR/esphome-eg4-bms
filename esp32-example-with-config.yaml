substitutions:
  name: eg4-bms-config
  device_description: "Monitor and configure an EG4 BMS via RS485"
  external_components_source: github://rar/esphome-eg4-bms@dev
  tx_pin: GPIO16
  rx_pin: GPIO17

esphome:
  name: ${name}
  comment: ${device_description}
  min_version: 2024.6.0
  project:
    name: "rar.esphome-eg4-bms"
    version: 1.1.0

esp32:
  board: wemos_d1_mini32

external_components:
  - source: ${external_components_source}
    refresh: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

ota:
  platform: esphome

logger:
  level: DEBUG

# Enable Home Assistant API
api:

uart:
  id: uart_0
  # EG4 BMS default baud rate is 9600
  baud_rate: 9600
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  # Increased RX buffer for Modbus frames
  rx_buffer_size: 256

eg4_modbus:
  id: modbus0
  uart_id: uart_0

eg4_bms:
  id: bms0
  # Default address for master BMS is 0x10
  # For individual battery modules, use addresses 0x01-0x0F
  address: 0x10
  eg4_modbus_id: modbus0
  update_interval: 10s

binary_sensor:
  - platform: eg4_bms
    eg4_bms_id: bms0
    online_status:
      name: "${name} online status"
    heating:
      name: "${name} heating"
    charging:
      name: "${name} charging"
    discharging:
      name: "${name} discharging"

sensor:
  - platform: eg4_bms
    eg4_bms_id: bms0
    
    # Voltage sensors
    total_voltage:
      name: "${name} total voltage"
    min_cell_voltage:
      name: "${name} min cell voltage"
    max_cell_voltage:
      name: "${name} max cell voltage"
    delta_cell_voltage:
      name: "${name} delta cell voltage"
    
    # Current and power
    current:
      name: "${name} current"
    power:
      name: "${name} power"
    
    # Capacity
    remaining_capacity:
      name: "${name} remaining capacity"
    state_of_charge:
      name: "${name} state of charge"
    
    # Temperature
    temperature_1:
      name: "${name} temperature 1"
    temperature_2:
      name: "${name} temperature 2"
    pcb_temperature:
      name: "${name} pcb temperature"

text_sensor:
  - platform: eg4_bms
    eg4_bms_id: bms0
    status:
      name: "${name} status"
    warnings:
      name: "${name} warnings"
    protection:
      name: "${name} protection"
    errors:
      name: "${name} errors"

# Configuration parameters - CAUTION: Changing these affects BMS protection behavior
number:
  - platform: eg4_bms
    eg4_bms_id: bms0
    
    # Balancing configuration
    balance_starting_voltage:
      name: "${name} balance starting voltage"
      # Cells above this voltage will be balanced
    balance_voltage_difference:
      name: "${name} balance voltage difference"
      # Maximum voltage difference before balancing starts
    low_capacity_warning:
      name: "${name} low capacity warning"
      # Low capacity warning threshold in Ah
    
    # Cell voltage protection (per cell)
    cell_undervoltage_warning:
      name: "${name} cell UV warning"
    cell_undervoltage_protection:
      name: "${name} cell UV protection"
    cell_undervoltage_release:
      name: "${name} cell UV release"
    cell_overvoltage_warning:
      name: "${name} cell OV warning"
    cell_overvoltage_protection:
      name: "${name} cell OV protection"
    cell_overvoltage_release:
      name: "${name} cell OV release"
    
    # Pack voltage protection (total pack)
    pack_undervoltage_warning:
      name: "${name} pack UV warning"
    pack_undervoltage_protection:
      name: "${name} pack UV protection"
    pack_undervoltage_release:
      name: "${name} pack UV release"
    pack_overvoltage_warning:
      name: "${name} pack OV warning"
    pack_overvoltage_protection:
      name: "${name} pack OV protection"
    pack_overvoltage_release:
      name: "${name} pack OV release"
    
    # Charge overcurrent protection
    charge_overcurrent1_protection:
      name: "${name} charge OC1 protection"
    charge_overcurrent1_delay:
      name: "${name} charge OC1 delay"
    charge_overcurrent2_protection:
      name: "${name} charge OC2 protection"
    charge_overcurrent2_delay:
      name: "${name} charge OC2 delay"
    
    # Discharge overcurrent protection
    discharge_overcurrent1_protection:
      name: "${name} discharge OC1 protection"
    discharge_overcurrent1_delay:
      name: "${name} discharge OC1 delay"
    discharge_overcurrent2_protection:
      name: "${name} discharge OC2 protection"
    discharge_overcurrent2_delay:
      name: "${name} discharge OC2 delay"
    
    # Short circuit protection
    short_circuit_protection_delay:
      name: "${name} short circuit delay"
    
    # Charge temperature protection
    charge_undertemp_warning:
      name: "${name} charge undertemp warning"
    charge_undertemp_protection:
      name: "${name} charge undertemp protection"
    charge_undertemp_release:
      name: "${name} charge undertemp release"
    charge_overtemp_warning:
      name: "${name} charge overtemp warning"
    charge_overtemp_protection:
      name: "${name} charge overtemp protection"
    charge_overtemp_release:
      name: "${name} charge overtemp release"
    
    # Discharge temperature protection
    discharge_undertemp_warning:
      name: "${name} discharge undertemp warning"
    discharge_undertemp_protection:
      name: "${name} discharge undertemp protection"
    discharge_undertemp_release:
      name: "${name} discharge undertemp release"
    discharge_overtemp_warning:
      name: "${name} discharge overtemp warning"
    discharge_overtemp_protection:
      name: "${name} discharge overtemp protection"
    discharge_overtemp_release:
      name: "${name} discharge overtemp release"
    
    # PCB temperature protection
    pcb_undertemp_warning:
      name: "${name} pcb undertemp warning"
    pcb_undertemp_protection:
      name: "${name} pcb undertemp protection"
    pcb_undertemp_release:
      name: "${name} pcb undertemp release"
    pcb_overtemp_warning:
      name: "${name} pcb overtemp warning"
    pcb_overtemp_protection:
      name: "${name} pcb overtemp protection"
    pcb_overtemp_release:
      name: "${name} pcb overtemp release"
    
    # Heating control
    heating_start_temp:
      name: "${name} heating start temp"
    heating_stop_temp:
      name: "${name} heating stop temp"
    charge_heating_start_temp:
      name: "${name} charge heating start temp"
    charge_heating_stop_temp:
      name: "${name} charge heating stop temp"
    discharge_heating_start_temp:
      name: "${name} discharge heating start temp"
    discharge_heating_stop_temp:
      name: "${name} discharge heating stop temp"
    
    # Ambient temperature protection
    ambient_undertemp_warning:
      name: "${name} ambient undertemp warning"
    ambient_undertemp_protection:
      name: "${name} ambient undertemp protection"
    ambient_undertemp_release:
      name: "${name} ambient undertemp release"
    ambient_overtemp_warning:
      name: "${name} ambient overtemp warning"
    ambient_overtemp_protection:
      name: "${name} ambient overtemp protection"
    ambient_overtemp_release:
      name: "${name} ambient overtemp release"
